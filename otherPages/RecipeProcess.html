<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recipe_process</title>
    <link rel="stylesheet" href="../src/input.css">
    <link rel="stylesheet" href="../src/output.css">
</head>

<body>
    <nav class="w-full shadow-[0px_10px_20px_rgba(0,0,0,0.3)] flex items-start justify-between md:px-25 p-3 text-2xl text-gray-800 tracking-[5px] font-serif font-semibold">
        <h1 class="RecipeNameHeader ">RecipeName</h1>
        <label style="padding:2px 6px 2px 10px"class="cursor-pointer   shadow-[0px_0px_5px_rgba(0,0,0,0.3)] rounded-[50%] border border-gray-300 items-center justify-around inline-flex">
        <input type="checkbox" class="peer sr-only"/>
        <span class="text-4xl text-gray-300
            peer-checked:text-red-500
        ">♥</span>
    </label>
    </nav>
    <div class="p-5 w-full flex items-center justify-around shadow-inherit shadow-[0px_10px_20px_rgba(0,0,0,0.3)]">
        <img class="recipeImage object-fill rounded-3xl border-3 border-black" src="" alt="">
    </div>
    <div class="flex shadow-inherit shadow-[0px_10px_20px_rgba(0,0,0,0.3)] p-5 flex-col itmes-center justify-around gap-2 w-full  ">
        <h1  class="text-2xl font-semibold tracking-[2px] font-serif">Ingredients</h1>
        <p class="RecipeIngredients md:max-w-200 font-mono"></p>
    </div>
    <div class="md:px-25  p-5  flex flex-col items-center gap-2">
        <h1 class="p-2 text-center text-2xl font-serif  tracking-normal-[2px] font-bold md:text-2xl">Recipe Process Step by Step</h1>
        <p class="md:max-w-200 RecipeProcess flex flex-col gap-3 font-mono items-center justify-around text-[18px] "></p>
    </div>
    <div class="p-5 shadow-inherit shadow-[0px_10px_20px_rgba(0,0,0,0.3)] md:px-25 px-3 flex flex-col items-center gap-2">
        <h1 class=" p-2 text-center text-2xl font-serif tracking-[2px] ̥ font-bold md:text-lg">Recipe message for you</h1>
        <p class="RecipeMessage font-mono tracking-[1px]"></p>
    </div>
    <footer class="w-full p-[10px_0px_0px_0px] px-3 md:px-25  flex items-end justify-center gap-3">
        <div class = "md:max-w-200 p-2 shadow-[0px_10px_10px_rgba(0,0,0,0.5)] rounded-[20px_20px_0px_0px] h-25 w-full bg-[rgba(0,0,0,0.4)]">
            <span class="font-bold text-white text-[20px] md:text-2xl">Recipe hold</span>
        </div>
    </footer>
</body>
<script type="module"src="Process.js"></script>
